name: Deploy Beta (tec.90s.agency)

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: deploy-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ECC Unit Tests Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, curl, zip, gd
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Unit Test Suite
        run: vendor/bin/phpunit --testsuite=Unit

  deploy:
    name: Deploy to tec.90s.agency (srv2)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/grupaqgl/web/tec.90s.agency/public_html
            bash scripts/deploy-beta.sh beta
